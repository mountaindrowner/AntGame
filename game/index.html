<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120a05">
<title>Underfoot</title>
<!-- Home Screen (docs/PHONE.md): added there, it opens full screen with this icon. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Underfoot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Pixelify+Sans:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Nunito+Sans:wght@400;600;700;800&display=swap">
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="top">
  <div id="stats">…</div>
  <div id="vitals"><div class="vital" data-tip="Health: fights, stings and bites take it; it heals when you rest."><i>❤</i><div class="track"><div id="hplag"></div><div id="hpbar"></div></div><em id="hpv"></em></div><div class="vital" data-tip="Hunger: eat at the nest, at a finished outpost, or beside a forager carrying food. Empty, it starts taking your health."><i>🍖</i><div class="track" id="hunger"><div id="hungerbar"></div></div><em id="huv"></em></div></div>
  <div id="msg"></div>
</div>
<div id="bar2">
  <button id="menubtn" class="ico"></button>
  <button id="viewbtn" class="ico"></button>
  <button id="mapbtn" class="ico"></button>
  <button id="evolvebtn" class="ico"></button>
  <button id="jobsbtn" class="ico"></button>
  <button id="zoom" class="ico"></button>
  <button id="help" class="ico"></button>
</div>
<div id="sheet" class="hidden"></div>
<div id="bar" class="dock">
  <div class="places">
    <button id="enter" class="ico hidden"></button>
    <button id="outpostbtn" class="ico hidden"></button>
  </div>
  <div class="core">
    <button id="act" class="ico primary"></button>
    <button id="mark" class="ico"></button>
    <button id="recruit" class="ico"></button>
    <button id="release" class="ico" disabled></button>
  </div>
  <div class="crew"></div>
</div>
<div id="barn" class="dock hidden">
  <button id="buildnest" class="ico primary"></button>
  <button id="queenbtn" class="ico primary"></button>
  <button id="levelbtn" class="ico"></button>
  <button id="exitnest" class="ico"></button>
</div>
<div id="tip" class="hidden" role="tooltip"></div>
<div id="hurt"></div>
<div id="saved">Saved ✓</div>
<div id="bossbar" class="hidden"><div class="bn"></div><div class="bb"><div class="bf"></div><span class="bp"></span></div><div class="bs"></div></div>
<div id="banner" class="hidden"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
