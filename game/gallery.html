<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Underfoot Models</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
  /* A contact sheet of the game's models: one card per pose, grouped as the game uses them. The game's own paper and soil palette. */
  :root { --bg: #efe6d2; --ink: #2a1a0e; --mute: #6e5e4a; --card: #fbf6ea; --line: #d6c6a2; --stage-a: #e6edf0; --stage-b: #a9b9c3; --display: "Bungee", Impact, "Arial Black", sans-serif; --body: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1510; --ink: #f1e8d6; --mute: #a8977f; --card: #251d16; --line: #3c2f23; --stage-a: #3a4650; --stage-b: #1e262c; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1b1510; --ink: #f1e8d6; --mute: #a8977f; --card: #251d16; --line: #3c2f23; --stage-a: #3a4650; --stage-b: #1e262c; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { padding-block: 20px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font: 28px/1.1 var(--display); letter-spacing: 0.5px; text-wrap: balance; }
  header p { margin: 0; color: var(--mute); max-width: 70ch; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  nav button.on { background: var(--ink); color: var(--bg); }
  nav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  main { max-width: 1200px; margin: 0 auto; padding-block: 8px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(160px, 100%), 1fr)); gap: 12px; }
  .m { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .m canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; background: radial-gradient(circle at 50% 40%, var(--stage-a), var(--stage-b)); image-rendering: pixelated; }
  .m b { display: block; padding: 8px 10px 0; font-size: 14px; }
  .m i { display: block; padding: 0 10px 9px; font-style: normal; font-size: 12px; color: var(--mute); }
</style>
</head>
<body>
<header>
  <h1>Every model in Underfoot</h1>
  <p>All the game's models, as the game draws them, turning slowly. Each is made in code and baked into a few poses; each is also exported as a standalone <code>.glb</code> file in <code>game/assets/models/</code> that opens in Blender or any 3D viewer.</p>
  <nav id="tabs"></nav>
</header>
<main id="grid"></main>
<script type="module" src="./src/gallery.js"></script>
</body>
</html>
